    <script>
      document.addEventListener("DOMContentLoaded", function() {
        var options = {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ],
          throwOnError: false
        };

        var timeout = null;
        var callback = function(mutationsList, observer) {
          if (window.renderMathInElement) {
            // Check if there is any unrendered LaTeX delimiter remaining in the body text
            if (document.body.textContent && document.body.textContent.indexOf("$") !== -1) {
              if (timeout) clearTimeout(timeout);
              timeout = setTimeout(function() {
                window.renderMathInElement(document.body, options);
              }, 100);
            }
          }
        };

        var observer = new MutationObserver(callback);
        observer.observe(document.body, { childList: true, subtree: true, characterData: true });
        
        // Initial auto-render when window loads
        window.addEventListener("load", function() {
          if (window.renderMathInElement) {
            window.renderMathInElement(document.body, options);
          }
        });
      });
    </script>
